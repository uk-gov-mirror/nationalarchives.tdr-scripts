name: Sync dev environment with intg
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log the deployments without dispatching any workflows'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 4 * * *' # 05:00 BST / 04:00 GMT
permissions: {}
jobs:
  # These two jobs plan (but never apply) terraform against dev, so drift can
  # be surfaced in the sync summary without ever applying infrastructure
  # changes unattended. da-reference-generator is checked separately as its
  # deploy workflow applies its own terraform alongside the lambda deploy, so
  # that repository's deploy is skipped below if this plan isn't clean.
  terraform-plan-dev-environment:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      status: ${{ steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan-status
        with:
          repository: tdr-terraform-environments
          management-account: ${{ secrets.MANAGEMENT_ACCOUNT }}
          workflow-pat: ${{ secrets.WORKFLOW_PAT }}
          tf-var-name: tdr_account_number
          tf-var-value: ${{ secrets.DEV_ACCOUNT_NUMBER }}

  terraform-plan-reference-generator:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      status: ${{ steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan-status
        with:
          repository: da-reference-generator
          working-directory: terraform
          management-account: ${{ secrets.MANAGEMENT_ACCOUNT }}
          workflow-pat: ${{ secrets.WORKFLOW_PAT }}
          tf-var-name: hosting_project
          tf-var-value: tdr

  sync:
    runs-on: ubuntu-latest
    needs:
      - terraform-plan-dev-environment
      - terraform-plan-reference-generator
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          cd dev-environment-sync
          pip install -r requirements.txt
          python sync_dev_environment.py
        env:
          GITHUB_API_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry-run }}
          DEV_ENVIRONMENT_TERRAFORM_STATUS: ${{ needs.terraform-plan-dev-environment.outputs.status || 'error' }}
          REFERENCE_GENERATOR_TERRAFORM_STATUS: ${{ needs.terraform-plan-reference-generator.outputs.status || 'error' }}
